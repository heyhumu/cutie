<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday, Princess Humu</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=Hind+Siliguri:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#0a0d24;--tx:#f2ead8;--gold:#e9b96e;--rose:#d98a9b;--card:#161b42}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',sans-serif;font-weight:300;overflow-x:hidden;line-height:1.7}
#sky{position:fixed;inset:0;z-index:-1}
h1,h2,.serif{font-family:'Playfair Display','Hind Siliguri',serif;font-weight:500}
section{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center}
h2{font-size:clamp(1.6rem,5vw,2.4rem);color:var(--gold);margin-bottom:28px}
#gate{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center;transition:opacity 1s}
#gate p{font-family:'Playfair Display',serif;font-size:clamp(1.3rem,5vw,2rem);min-height:2.6em}
button{font:inherit;cursor:pointer;color:var(--bg);background:var(--gold);border:0;border-radius:40px;padding:12px 34px;font-weight:500;transition:transform .2s}
button:hover{transform:scale(1.06)}button:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
#main{display:none}
.hero img{width:min(78vw,340px);aspect-ratio:3/4;object-fit:cover;border-radius:200px 200px 16px 16px;border:2px solid var(--gold);box-shadow:0 0 60px #e9b96e44;margin-bottom:28px}
.hero h1{font-size:clamp(2rem,8vw,3.6rem);line-height:1.2}
.hero p{color:var(--rose);font-style:italic;margin-top:10px;font-family:'Playfair Display',serif}
#cd{font-size:clamp(1.4rem,5vw,2.2rem);color:var(--gold);font-family:'Playfair Display',serif;margin:10px 0}
.story{gap:22px}
.story img{width:min(80vw,340px);aspect-ratio:4/5;object-fit:cover;border:10px solid #f2ead8;border-bottom-width:38px;border-radius:4px;box-shadow:0 14px 40px #0008;transform:rotate(-2deg);transition:transform .8s}
.story:nth-of-type(even) img{transform:rotate(2deg)}
.story.in img{transform:rotate(0)}
.story p{max-width:26ch;font-size:1.25rem;font-family:'Playfair Display',serif;font-style:italic}
.rv{opacity:0;transition:opacity 1.2s}.rv.in{opacity:1}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;width:min(94vw,760px)}
.card{height:130px;perspective:800px;cursor:pointer;border:0;background:none;color:inherit;padding:0}
.card .c{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.card.f .c{transform:rotateY(180deg)}
.card span{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:12px;border-radius:14px;border:1px solid var(--gold)}
.card .a{background:var(--card);font-size:1.6rem}
.card .b{background:var(--gold);color:var(--bg);transform:rotateY(180deg);font-weight:500}
.jar{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.jar button{background:none;color:var(--gold);font-size:2rem;padding:6px 12px;border-radius:50%;animation:fl 3s ease-in-out infinite}
.jar button:nth-child(2n){animation-delay:.8s}.jar button:nth-child(3n){animation-delay:1.5s}
@keyframes fl{50%{transform:translateY(-10px)}}
#wish{min-height:3.4em;max-width:30ch;font-size:1.2rem;font-style:italic;font-family:'Playfair Display',serif}
#flame{cursor:pointer;transform-origin:50% 100%;animation:fk .5s infinite alternate}
@keyframes fk{to{transform:scale(1.12,.92)}}
#cm{min-height:4em;margin-top:14px;font-family:'Playfair Display',serif;font-size:1.2rem}
.letter{align-items:center;min-height:0}
.letter img{width:min(70vw,260px);aspect-ratio:1;object-fit:cover;border-radius:50%;border:2px solid var(--gold);margin-bottom:24px}
#lt{max-width:36rem;text-align:left;font-size:1.08rem;line-height:2;font-weight:400}
#lt p{margin-bottom:1.3em}
footer{padding:50px 20px 90px;text-align:center;color:var(--gold);font-style:italic;font-family:'Playfair Display',serif}
#mus{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;font-size:.9rem;padding:9px 16px;display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<canvas id="sky"></canvas>

<div id="gate"><p id="g1"></p><p id="g2" style="color:var(--rose);font-size:1.1rem"></p><button id="open" style="visibility:hidden">Open 🎁</button></div>

<div id="main">
  <section class="hero"><img src="hero.jpg" alt="Humu"><h1>Happy Birthday,<br>Princess Humu 🎂</h1><p>Today is all about you.</p></section>
  <section class="rv"><p>Just</p><div id="cd"></div><p id="cdt">But I couldn’t wait to show you this.</p></section>
  <div id="story"></div>
  <section class="rv"><h2>5 things I admire about you</h2><div class="cards" id="cards"></div><p style="margin-top:16px;font-size:.9rem;opacity:.7">Tap a card</p></section>
  <section class="rv"><h2>Wishes for you</h2><div class="jar" id="jar"></div><p id="wish">Tap a lantern ✨</p></section>
  <section class="rv"><h2>Make a wish</h2>
    <svg width="220" height="200" viewBox="0 0 220 200" role="img" aria-label="Birthday cake">
      <rect x="30" y="100" width="160" height="80" rx="10" fill="#d98a9b"/><rect x="30" y="100" width="160" height="22" rx="10" fill="#f2ead8"/>
      <rect x="106" y="62" width="8" height="40" fill="#e9b96e"/>
      <g id="flame" tabindex="0"><ellipse cx="110" cy="48" rx="9" ry="16" fill="#ffb347"/><ellipse cx="110" cy="52" rx="4" ry="8" fill="#fff3c4"/></g>
    </svg>
    <p id="cm">Blow out the candle and make a wish. 🕯️<br><small style="opacity:.7">Tap the flame</small></p></section>
  <section class="letter rv"><img src="final.jpg" alt="Humu"><div id="lt">Loading…</div></section>
  <footer>Made with care, just for you. ✨</footer>
</div>
<button id="mus" aria-label="Toggle music">⏸ Music</button>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
const VIDEO_ID='0nLdXXuk74M'; // <-- YouTube video ID of "Until I Found You"
const $=s=>document.querySelector(s);
// stars
const cv=$('#sky'),cx=cv.getContext('2d');let S=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight;S=Array.from({length:130},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.4+.3,p:Math.random()*6}))}
rs();addEventListener('resize',rs);
(function d(t){cx.clearRect(0,0,cv.width,cv.height);S.forEach(s=>{cx.globalAlpha=.4+.6*Math.abs(Math.sin(t/1400+s.p));cx.fillStyle='#f2ead8';cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill()});requestAnimationFrame(d)})(0);
// gate typing
function type(el,txt,cb){let i=0;(function n(){el.textContent=txt.slice(0,++i);i<txt.length?setTimeout(n,55):cb&&setTimeout(cb,500)})()}
type($('#g1'),'30 October.',()=>type($('#g2'),'A day the world got a little brighter.',()=>$('#open').style.visibility='visible'));
// content
const story=[['story1','Some people don’t try to stand out. They just do.'],['story2','Your smile has a way of making an ordinary day feel lighter.'],['story3','Kind, honest, and real. That’s rare, and you are all of it.'],['story4','Some people make the world a little softer just by being in it.'],['story5','I hope this year gives you everything you’ve been quietly hoping for.'],['story6','Whatever this year brings, I hope you always feel how much you are worth.']];
$('#story').innerHTML=story.map(([f,t])=>`<section class="story rv"><img src="${f}.jpg" alt="" loading="lazy"><p>${t}</p></section>`).join('');
const adm=['Your smile','Your kindness','The way you stay true to yourself','Your calm, gentle presence','Simply, you'];
$('#cards').innerHTML=adm.map(t=>`<button class="card"><div class="c"><span class="a">🤍</span><span class="b">${t}<br><small>I really mean this.</small></span></div></button>`).join('');
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>c.classList.toggle('f'));
const wishes=['May every wish you make this year come true.','May your smile never fade.','May you always be healthy and happy.','May good people and good moments find you everywhere.','May your dreams turn into reality.'];
$('#jar').innerHTML=wishes.map((_,i)=>`<button aria-label="Wish ${i+1}">🏮</button>`).join('');
document.querySelectorAll('.jar button').forEach((b,i)=>b.onclick=()=>{$('#wish').textContent=wishes[i]});
// reveal
const io=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&x.target.classList.add('in')),{threshold:.25});
function obs(){document.querySelectorAll('.rv').forEach(e=>io.observe(e))}
// countdown
const T=new Date(2026,9,30,0,0,0);
function cd(){const ms=T-new Date();if(ms<=0){$('#cd').textContent='It’s your day! 🎉';$('#cdt').textContent='';return}
const d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;
$('#cd').textContent=`${d} days, ${h}h ${m}m ${s}s to go…`}
cd();setInterval(cd,1000);
// cake
$('#flame').onclick=$('#flame').onkeydown=e=>{if(e.type==='keydown'&&e.key!=='Enter')return;
$('#flame').style.display='none';$('#cm').innerHTML='Happy Birthday, Princess Humu! 🎉<br><small>I hope your wish comes true.</small>';
confetti({particleCount:180,spread:90,origin:{y:.7},colors:['#e9b96e','#d98a9b','#f2ead8']})};
// letter
fetch('letter.txt').then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{
$('#lt').innerHTML=t.trim().split(/\n\s*\n/).map(p=>`<p>${p.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>')}</p>`).join('')}).catch(()=>$('#lt').textContent='(letter.txt not found)');
// music
let yt;const mb=$('#mus');
function music(){yt=document.createElement('iframe');yt.allow='autoplay';yt.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';
yt.src=`https://www.youtube.com/embed/${VIDEO_ID}?autoplay=1&loop=1&playlist=${VIDEO_ID}&enablejsapi=1`;document.body.appendChild(yt);mb.style.display='block'}
let on=true;mb.onclick=()=>{on=!on;yt.contentWindow.postMessage(JSON.stringify({event:'command',func:on?'playVideo':'pauseVideo',args:''}),'*');mb.textContent=on?'⏸ Music':'▶ Music'};
// open
$('#open').onclick=()=>{const g=$('#gate');g.style.opacity=0;setTimeout(()=>g.remove(),1000);$('#main').style.display='block';obs();
if(VIDEO_ID!=='YT_VIDEO_ID')music();confetti({particleCount:120,spread:100,origin:{y:.6},colors:['#e9b96e','#d98a9b','#f2ead8']})};
</script></body></html>
